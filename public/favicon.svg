<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="url(#ring)" stroke-width="2"/>
  <!-- Magnifying glass lens -->
  <circle cx="14" cy="13" r="6" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <!-- Handle -->
  <line x1="19" y1="18" x2="23" y2="22" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <!-- Code brackets inside lens -->
  <text x="14" y="16.5" text-anchor="middle" font-family="monospace" font-size="5.5" font-weight="bold" fill="#06B6D4">{/}</text>
</svg>
